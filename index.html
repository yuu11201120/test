<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TelecomWatch - 通信キャリアニュース</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <span class="logo-icon">T</span>
          <span class="logo-text">TelecomWatch</span>
        </div>
      </div>
      <nav class="sidebar-nav">
        <button class="nav-item active" data-filter="all">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          <span>すべてのニュース</span>
        </button>
        <button class="nav-item" data-filter="docomo">
          <span class="carrier-dot" style="background: #c41e3a"></span>
          <span>NTTドコモ</span>
        </button>
        <button class="nav-item" data-filter="au">
          <span class="carrier-dot" style="background: #ee7800"></span>
          <span>au / KDDI</span>
        </button>
        <button class="nav-item" data-filter="softbank">
          <span class="carrier-dot" style="background: #001c58"></span>
          <span>ソフトバンク</span>
        </button>
        <button class="nav-item" data-filter="rakuten">
          <span class="carrier-dot" style="background: #bf0000"></span>
          <span>楽天モバイル</span>
        </button>
        <div class="nav-divider"></div>
        <button class="nav-item" data-filter="bookmarks">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
          <span>ブックマーク</span>
          <span class="badge" id="bookmarkCount">0</span>
        </button>
      </nav>
      <div class="sidebar-footer">
        <div class="last-updated" id="lastUpdated"></div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Header -->
      <header class="header">
        <button class="menu-toggle" id="menuToggle">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <h1 class="page-title" id="pageTitle">すべてのニュース</h1>
        <div class="header-actions">
          <div class="search-box">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" placeholder="ニュースを検索..." id="searchInput" class="search-input">
          </div>
        </div>
      </header>

      <!-- Category Filter -->
      <div class="category-bar" id="categoryBar">
        <button class="category-chip active" data-category="all">すべて</button>
        <button class="category-chip" data-category="plan">料金プラン</button>
        <button class="category-chip" data-category="5g">5G / 通信</button>
        <button class="category-chip" data-category="service">新サービス</button>
        <button class="category-chip" data-category="trouble">障害情報</button>
        <button class="category-chip" data-category="device">端末</button>
        <button class="category-chip" data-category="business">経営・業績</button>
      </div>

      <!-- News Feed -->
      <section class="news-feed" id="newsFeed"></section>

      <!-- Empty State -->
      <div class="empty-state" id="emptyState" style="display: none;">
        <div class="empty-state-icon">
          <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </div>
        <h3>ニュースが見つかりません</h3>
        <p>検索条件やフィルターを変更してみてください</p>
      </div>
    </main>
  </div>

  <!-- Article Detail Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modal">
      <div class="modal-header">
        <button class="modal-close" id="modalClose">&times;</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="app.js"></script>
</body>
</html>
